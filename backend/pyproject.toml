[project]
name = "mastergrow-api"
version = "0.1.0"
description = "API del sistema de cultivo indoor MasterGrow"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "python-multipart>=0.0.18",
    "pillow>=11.0",
    "alembic>=1.14",
    "aiomqtt>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]   # generadas por Alembic
"tests/*" = ["ASYNC240", "ASYNC110"]  # en tests: leer archivos locales y esperar con sleep está bien
"app/web/*.py" = ["E501"]            # HTML/JS embebido

# MasterGrow — entorno de desarrollo: broker MQTT + PostgreSQL + API.
#   cp .env.example .env   (y cambiar las claves)
#   docker compose up -d --build
name: mastergrow

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    ports:
      - "1883:1883"            # expuesto a la LAN: los nodos ESP32 se conectan acá
    env_file: .env
    entrypoint: ["/bin/sh", "/mosquitto/init/entrypoint.sh"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/entrypoint.sh:/mosquitto/init/entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u \"$$MQTT_API_USER\" -P \"$$MQTT_API_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 3"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"  # solo local
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MQTT_HOST: mosquitto
      IMAGES_DIR: /data/images
      FIRMWARE_DIR: /data/firmware
    ports:
      - "8000:8000"            # expuesto a la LAN: los nodos suben capturas acá
    volumes:
      - images:/data/images
      - firmware:/data/firmware
    depends_on:
      db: { condition: service_healthy }
      mosquitto: { condition: service_healthy }

volumes:
  mosquitto-data:
  db-data:
  images:
  firmware:
